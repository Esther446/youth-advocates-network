<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - YAN Rwanda</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-secondary);
        }
        .reset-container {
            background: var(--bg-primary);
            padding: 3rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        .reset-container h2 {
            margin-bottom: 0.5rem;
        }
        .reset-container p {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="reset-container">
        <h2>Reset Password</h2>
        <p>Please enter your new password below.</p>
        
        <form id="resetPasswordForm">
            <div class="form-group" style="text-align: left;">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" required minlength="8" placeholder="Password (min 8 chars)" class="form-control">
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;" id="resetBtn">
                Reset Password
            </button>
        </form>
        
        <div id="resetMessage" style="margin-top: 1.5rem; display: none; padding: 1rem; border-radius: 0.5rem;"></div>
        
        <a href="index.html" style="display: inline-block; margin-top: 1.5rem; color: var(--primary-color); text-decoration: none; font-size: 0.9rem;">
            ← Back to Home
        </a>
    </div>

    <!-- Load config and apiClient -->
    <script src="config.js"></script>
    <script src="apiClient.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const form = document.getElementById('resetPasswordForm');
            const messageDiv = document.getElementById('resetMessage');
            const resetBtn = document.getElementById('resetBtn');

            if (!token) {
                messageDiv.style.display = 'block';
                messageDiv.style.background = '#fee2e2';
                messageDiv.style.color = '#b91c1c';
                messageDiv.textContent = 'Invalid or missing reset token.';
                form.style.display = 'none';
                return;
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const newPassword = document.getElementById('newPassword').value;

                resetBtn.disabled = true;
                resetBtn.textContent = 'Resetting...';

                try {
                    const response = await fetch(`${YAN_CONFIG.API_BASE_URL}/auth/resetpassword/${token}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ password: newPassword })
                    });
                    
                    const data = await response.json();

                    if (response.ok) {
                        messageDiv.style.display = 'block';
                        messageDiv.style.background = '#dcfce7';
                        messageDiv.style.color = '#15803d';
                        messageDiv.textContent = 'Password reset successfully! You will be redirected...';
                        form.style.display = 'none';
                        
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 3000);
                    } else {
                        throw new Error(data.message || 'Failed to reset password');
                    }
                } catch (error) {
                    messageDiv.style.display = 'block';
                    messageDiv.style.background = '#fee2e2';
                    messageDiv.style.color = '#b91c1c';
                    messageDiv.textContent = error.message;
                    resetBtn.disabled = false;
                    resetBtn.textContent = 'Reset Password';
                }
            });
        });
    </script>
</body>
</html>
